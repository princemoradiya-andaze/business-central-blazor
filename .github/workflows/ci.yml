name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BusinessCentralBlazor.sln
      - name: Build
        run: dotnet build BusinessCentralBlazor.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test BusinessCentralBlazor.sln --no-build --configuration Release
