name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BusinessCentralBlazor.sln
      - name: Restore EF Core tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build BusinessCentralBlazor.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test BusinessCentralBlazor.sln --no-build --configuration Release
      - name: Check EF Core migration model
        env:
          ConnectionStrings__ErpDatabase: Server=localhost;Database=ModelValidation;Integrated Security=True;TrustServerCertificate=True
        run: dotnet ef migrations has-pending-model-changes --project src/BusinessCentralBlazor.Infrastructure --startup-project src/BusinessCentralBlazor.Web
